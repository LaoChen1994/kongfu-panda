<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251c" />
    <title>竹林无双 · 构筑试炼</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-seal">竹</span>
          <div>
            <p class="eyebrow">灵竹谷 · 守卫试炼</p>
            <h1>竹林无双</h1>
          </div>
        </div>
        <div class="controls" aria-label="操作说明">
          <span><kbd>WASD</kbd> 移动</span>
          <span><kbd>SPACE</kbd> 闪避</span>
          <span><kbd>ESC</kbd> 暂停</span>
        </div>
      </header>

      <section class="playfield" aria-label="游戏画布">
        <div id="game"></div>
        <div id="pause-overlay" class="overlay" hidden>
          <div class="overlay-card">
            <strong id="overlay-title">竹息凝神</strong>
            <span id="overlay-copy">按 ESC 继续战斗</span>
          </div>
        </div>
        <div id="choice-overlay" class="choice-overlay" hidden>
          <div class="choice-panel">
            <p id="choice-kicker" class="choice-kicker">境界突破</p>
            <h2 id="choice-title">选择一门强化</h2>
            <p id="choice-copy" class="choice-copy">战斗已暂停，选择会立即改变本局构筑</p>
            <div id="choice-cards" class="choice-cards"></div>
            <button id="continue-wave" class="continue-wave" type="button" hidden>整备完毕 · 进入下一波</button>
          </div>
        </div>
        <div id="hurt-vignette" class="hurt-vignette"></div>
        <div class="hud" aria-live="polite">
          <div class="health-card">
            <span>山岚 · Lv.<b id="level">1</b></span>
            <div class="health-track"><i id="health-fill"></i></div>
            <b id="health-text">110 / 110</b>
            <div class="xp-track"><i id="xp-fill"></i></div>
            <small>灵竹 <b id="xp-text">0 / 18</b></small>
          </div>
          <div class="stats">
            <span>第 <b id="wave">1</b> 波</span>
            <span>剩余 <b id="wave-time">00:50</b></span>
            <span>击破 <b id="kills">0</b></span>
            <span>铜钱 <b id="coins">0</b></span>
          </div>
          <div id="dash" class="dash ready">闪避就绪</div>
        </div>
        <div class="weapon-strip">
          <span class="weapon-slot"><img src="/assets/weapons/bamboo-staff.png" alt="青竹杖" /><span><b>青竹杖</b><small>近战横扫</small></span></span>
          <span class="weapon-slot"><img src="/assets/weapons/leaf-dart.png" alt="飞叶" /><span><b>飞叶</b><small>自动追敌</small></span></span>
        </div>
        <aside class="build-panel" aria-label="当前构筑">
          <b>本局构筑</b>
          <div id="build-tags"><span>初入竹林</span></div>
          <div id="item-icons" class="item-icons"></div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
