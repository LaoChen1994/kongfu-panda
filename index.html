<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251c" />
    <title>竹林无双 · 构筑试炼</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-seal">竹</span>
          <div>
            <p class="eyebrow">灵竹谷 · 守卫试炼</p>
            <h1>竹林无双</h1>
          </div>
        </div>
        <div class="controls" aria-label="操作说明">
          <span><kbd>WASD</kbd> 移动</span>
          <span><kbd>SPACE</kbd> 闪避</span>
          <span><kbd>ESC</kbd> 暂停</span>
        </div>
      </header>

      <section class="playfield" aria-label="游戏画布">
        <div id="game"></div>
        <div id="character-select" class="character-select">
          <div class="character-panel">
            <p class="choice-kicker">灵竹谷 · 出战名册</p>
            <h2>选择你的熊猫侠客</h2>
            <p class="character-lead">三种战斗节奏，每位侠客拥有专属武器与被动。</p>
            <div class="character-cards">
              <button class="character-card" type="button" data-character="shanlan">
                <span class="character-role">近战 · 爆发</span>
                <img src="/assets/characters/panda-wanderer.png" alt="山岚，手持青竹杖的近战熊猫" />
                <strong>山岚</strong>
                <span class="character-weapon">青竹杖 · 近战横扫</span>
                <span class="character-passive">每第 4 次近战变为 180° 旋风，并恢复生命。</span>
                <small>弱点：攻击距离较短</small>
              </button>
              <button class="character-card" type="button" data-character="qingtuan">
                <span class="character-role">远程 · 机动</span>
                <img src="/assets/characters/qingtuan.png" alt="青团，手持飞叶镖的远程熊猫" />
                <strong>青团</strong>
                <span class="character-weapon">飞叶镖 · 高速追敌</span>
                <span class="character-passive">每第 6 次射击分裂为 3 枚飞叶。</span>
                <small>弱点：生命较低</small>
              </button>
              <button class="character-card" type="button" data-character="shimo">
                <span class="character-role">肉盾 · 反击</span>
                <img src="/assets/characters/shimo.png" alt="石墨，手持铁竹盾的防御熊猫" />
                <strong>石墨</strong>
                <span class="character-weapon">铁竹盾 · 近战盾击</span>
                <span class="character-passive">每 8 秒获得护盾，破盾时震开周围敌人。</span>
                <small>弱点：移动速度较慢</small>
              </button>
            </div>
          </div>
        </div>
        <div id="pause-overlay" class="overlay" hidden>
          <div class="overlay-card">
            <strong id="overlay-title">竹息凝神</strong>
            <span id="overlay-copy">按 ESC 继续战斗</span>
          </div>
        </div>
        <div id="choice-overlay" class="choice-overlay" hidden>
          <div class="choice-panel">
            <p id="choice-kicker" class="choice-kicker">境界突破</p>
            <h2 id="choice-title">选择一门强化</h2>
            <p id="choice-copy" class="choice-copy">战斗已暂停，选择会立即改变本局构筑</p>
            <div id="choice-cards" class="choice-cards"></div>
            <div id="shop-layout" class="shop-layout" hidden>
              <aside class="shop-column shop-summary" aria-label="当前属性">
                <h3>侠客属性</h3>
                <div id="shop-stats"></div>
              </aside>
              <section class="shop-market" aria-label="补给商品">
                <div id="shop-cards" class="shop-cards"></div>
              </section>
              <aside class="shop-column shop-inventory" aria-label="宝物栏">
                <h3>宝物栏 <small>点击出售</small></h3>
                <div id="shop-inventory"></div>
              </aside>
              <div class="shop-actions">
                <button id="refresh-shop" type="button">刷新商品 · 4 铜钱</button>
                <span>锁定最多 1 件 · 出售返还 60%</span>
              </div>
            </div>
            <button id="continue-wave" class="continue-wave" type="button" hidden>整备完毕 · 进入下一波</button>
          </div>
        </div>
        <div id="hurt-vignette" class="hurt-vignette"></div>
        <div class="hud" aria-live="polite">
          <div class="health-card">
            <span><b id="character-name">山岚</b> · Lv.<b id="level">1</b></span>
            <div class="health-track"><i id="health-fill"></i></div>
            <b id="health-text">110 / 110</b>
            <div id="shield-row" class="shield-row" hidden>
              <div class="shield-track"><i id="shield-fill"></i></div>
              <small>护盾 <b id="shield-text">0 / 12</b></small>
            </div>
            <div class="xp-track"><i id="xp-fill"></i></div>
            <small>灵竹 <b id="xp-text">0 / 18</b></small>
          </div>
          <div class="stats">
            <span>第 <b id="wave">1</b> 波</span>
            <span>剩余 <b id="wave-time">00:50</b></span>
            <span>击破 <b id="kills">0</b></span>
            <span>铜钱 <b id="coins">0</b></span>
          </div>
          <div id="dash" class="dash ready">闪避就绪</div>
        </div>
        <div class="weapon-strip">
          <span class="weapon-slot"><img id="weapon-image" src="/assets/weapons/bamboo-staff.png" alt="青竹杖" /><span><b id="weapon-name">青竹杖</b><small id="weapon-copy">近战横扫</small></span></span>
        </div>
        <aside class="build-panel" aria-label="当前构筑">
          <b>本局构筑</b>
          <div id="build-tags"><span>初入竹林</span></div>
          <div id="item-icons" class="item-icons"></div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
